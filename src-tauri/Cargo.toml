[package]
name = "TestModelAlive"
version = "0.1.0"
description = "TMA endpoint manager"
authors = ["TMA"]
edition = "2021"

[lib]
name = "tma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "TestModelAlive"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
flate2 = "1.0"
reqwest = { version = "0.12", features = ["blocking", "gzip", "deflate", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5", features = [] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
toml_edit = "0.22"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }
